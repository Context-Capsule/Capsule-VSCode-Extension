name: VS Code Lockfile Refresh Once

on:
  push:
    branches: [agent/vscode-workspace-adapter]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[lockfile-refreshed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vscode-workspace-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh package-lock metadata and push
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches package metadata.'
            exit 0
          fi
          git config user.name 'GPT Slave'
          git config user.email 'unknown.entiti911@gmail.com'
          git add package-lock.json
          git commit -m 'refresh VS Code lockfile metadata [lockfile-refreshed]'
          git push origin HEAD:agent/vscode-workspace-adapter
