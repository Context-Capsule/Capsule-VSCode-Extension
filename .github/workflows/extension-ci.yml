name: VS Code Extension CI

on:
  push:
    branches: [main, 'agent/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run compile
      - name: Extension Development Host tests
        run: npm test
      - name: Publish Windows VS Code status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{ state = $state; context = 'ci/potus-vscode-windows'; description = "POTUS VS Code Windows: $($env:JOB_STATUS)" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null

  validate-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Verify POTUS-linux runner
        shell: bash
        run: |
          set -euo pipefail
          test '${{ runner.name }}' = 'POTUS-linux' || { echo "Expected runner POTUS-linux, got '${{ runner.name }}'" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run compile
      - name: Ensure Linux VS Code runtime dependencies are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v apt-get >/dev/null 2>&1; then
            echo 'This Linux runner needs apt-get to provision VS Code desktop runtime libraries.' >&2
            exit 1
          fi

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
          else
            apt-get update
          fi

          packages=(
            xvfb
            xauth
            libnspr4
            libnss3
            libgbm1
            libxkbcommon0
            libxcomposite1
            libxdamage1
            libxfixes3
            libxrandr2
            libpango-1.0-0
            libcairo2
          )

          choose_package() {
            local candidate
            for candidate in "$@"; do
              if apt-cache show "$candidate" >/dev/null 2>&1; then
                packages+=("$candidate")
                return 0
              fi
            done
            echo "None of the package alternatives are available: $*" >&2
            return 1
          }

          # Ubuntu 24.04 moved several desktop libraries to *t64 package names;
          # older supported Ubuntu releases still use the legacy names.
          choose_package libgtk-3-0t64 libgtk-3-0
          choose_package libasound2t64 libasound2
          choose_package libcups2t64 libcups2
          choose_package libatk1.0-0t64 libatk1.0-0
          choose_package libatk-bridge2.0-0t64 libatk-bridge2.0-0

          if command -v sudo >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          fi

          command -v xvfb-run >/dev/null 2>&1
      - name: Extension Development Host tests
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x1024x24' npm test
      - name: Publish Linux VS Code status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          [ "$JOB_STATUS" = cancelled ] && state=error
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/potus-vscode-linux\",\"description\":\"POTUS-linux VS Code: $JOB_STATUS\"}" >/dev/null

  watch-task-contract:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify F5 and watch tasks have no external esbuild matcher dependency
        shell: pwsh
        run: |
          $tasksText = Get-Content .vscode/tasks.json -Raw
          if ($tasksText -match '\$esbuild-watch') { throw 'tasks.json still depends on the optional $esbuild-watch matcher' }
          $extensions = Get-Content .vscode/extensions.json -Raw
          if ($extensions -match 'esbuild-problem-matchers') { throw 'extensions.json still recommends the removed matcher dependency' }
          $launch = Get-Content .vscode/launch.json -Raw | ConvertFrom-Json
          if ($launch.configurations[0].preLaunchTask -ne 'npm: compile') {
            throw 'F5 must use the finite npm: compile task instead of a background watch task'
          }
          $tasks = $tasksText | ConvertFrom-Json
          $compile = $tasks.tasks | Where-Object { $_.label -eq 'npm: compile' } | Select-Object -First 1
          if (-not $compile) { throw 'tasks.json is missing the npm: compile task used by F5' }
          if ($compile.isBackground) { throw 'F5 compile task must be finite, not background' }
      - name: Start actual esbuild watch and wait for bundle
        shell: pwsh
        run: |
          Remove-Item 'dist/extension.js' -ErrorAction SilentlyContinue
          $job = Start-Process $env:ComSpec -ArgumentList @('/d','/s','/c','npm run watch:esbuild') -PassThru -NoNewWindow
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and -not (Test-Path 'dist/extension.js')) {
              if ($job.HasExited) { throw "watch:esbuild exited early with code $($job.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path 'dist/extension.js')) { throw 'watch:esbuild did not produce dist/extension.js' }
            Write-Host 'Actual npm run watch:esbuild produced the extension bundle.'
          } finally {
            if (-not $job.HasExited) {
              taskkill /PID $job.Id /T /F 2>$null | Out-Null
              $global:LASTEXITCODE = 0
            }
          }
      - name: Publish VS Code watch status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          $body = @{ state = $state; context = 'ci/potus-vscode-watch'; description = "POTUS VS Code watch contract: $($env:JOB_STATUS)" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
